name: OpenCode – Agentic Workflow

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write # For branch/PR creation

jobs:
  opencode:
    if: contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run OpenCode Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_MACHINE_LEARNING }}
        uses: anomalyco/opencode/github@latest
        with:
          model: anthropic/claude-sonnet-4-20250514
          # Optional: share: true
          # Optional: prompt: "Review this PR for code quality and suggest improvements"
