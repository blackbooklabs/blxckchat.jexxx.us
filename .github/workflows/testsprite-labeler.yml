name: TestSprite PR Labeler

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  apply-labels:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Apply path-based TestSprite labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false
